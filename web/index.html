<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2A Hub · 异构 Agent 协同控制台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo">A2A</span>
      <span>A2A Hub</span>
      <small>异构 Agent 互联互通 · Agent-to-Agent Protocol v0.3</small>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="hub-status"><span class="dot"></span><span>连接中…</span></span>
    <span class="pill" id="agent-count"><span class="dot"></span><span>0 个 Agent</span></span>
    <button class="icon-btn" id="btn-refresh">刷新</button>
    <button class="icon-btn" id="btn-theme">🌓</button>
  </header>

  <main class="grid">

    <!-- ================= 左：Agent 名录 ================= -->
    <section class="col left">
      <div class="col-head">
        Agent 名录
        <span class="count" id="agents-count"></span>
      </div>
      <div class="col-body" id="agents-list">
        <div class="empty">加载中…</div>
      </div>
    </section>

    <!-- ================= 中：任务台 ================= -->
    <section class="col center">
      <div class="composer">
        <div class="modes" id="modes">
          <div class="mode active" data-mode="single">单 Agent<span class="hint">指定或自动路由</span></div>
          <div class="mode" data-mode="delegate">委派<span class="hint">选最合适的一个</span></div>
          <div class="mode" data-mode="broadcast">广播<span class="hint">并行 + 收敛</span></div>
          <div class="mode" data-mode="pipeline">流水线<span class="hint">串行接力</span></div>
          <div class="mode" data-mode="roundtable">圆桌<span class="hint">多轮讨论</span></div>
        </div>

        <textarea class="prompt" id="prompt"
          placeholder="输入任务，例如：帮我评审这段 Python 并发代码，并给出改写后的版本&#10;（⌘/Ctrl + Enter 执行）"></textarea>

        <div class="opts">
          <label id="wrap-agent">目标 Agent
            <select id="agent-select"><option value="">自动路由（按能力匹配）</option></select>
          </label>

          <label id="wrap-topk" class="hidden">参与数量
            <input type="number" id="topk" value="3" min="1" max="8" style="width:56px">
          </label>

          <label id="wrap-rounds" class="hidden">讨论轮数
            <input type="number" id="rounds" value="2" min="1" max="5" style="width:56px">
          </label>

          <label id="wrap-reviewer" class="hidden">评审 Agent
            <select id="reviewer"><option value="">不评审</option></select>
          </label>

          <label id="wrap-synth" class="hidden">结果综合者
            <select id="synthesizer"><option value="">结构化汇总</option></select>
          </label>

          <div class="spacer" style="flex:1"></div>
          <button class="btn ghost" id="btn-stop" disabled>停止</button>
          <button class="btn" id="btn-run">执行</button>
        </div>
      </div>

      <div class="timeline" id="timeline">
        <div class="empty" id="timeline-empty">
          选择一个模式，输入任务后点击「执行」。<br>
          协同过程会以时间线形式实时展开。
        </div>
      </div>
    </section>

    <!-- ================= 右：实时动态 ================= -->
    <section class="col right">
      <div class="col-head">
        Agent 动态
        <span class="count" id="feed-state">实时</span>
      </div>
      <div class="col-body" style="flex:0 0 46%;" id="feed">
        <div class="empty">等待事件…</div>
      </div>

      <div class="col-head" style="border-top:1px solid var(--border);">
        最近任务
        <span class="count" id="tasks-count"></span>
      </div>
      <div class="col-body" id="tasks">
        <div class="empty">暂无</div>
      </div>
    </section>

  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
