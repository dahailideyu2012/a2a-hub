[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-hub"
version = "0.5.0"
description = "A2A Hub - 异构 AI Agent 互联互通与多智能体协同网关（WorkBuddy / 千问办公 / 扣子 / Codex / Claude Code ...）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai-A2A contributors" }]
keywords = ["a2a", "agent-to-agent", "multi-agent", "orchestration", "json-rpc", "sse", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
a2a-hub = "a2a_hub.cli:main"

[tool.setuptools.packages.find]
include = ["a2a_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
